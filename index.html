<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Búsqueda del corazón </title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Libre+Baskerville:wght@400;700&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: #4b3428;
  background: #ead7ad;
  font-family: "Libre Baskerville", Georgia, serif;
}

.title {
  text-align: center;
  padding: 24px 16px 12px;
}

.small-title {
  margin: 0 0 4px;
  letter-spacing: 4px;
  font-size: 11px;
  opacity: .65;
}

h1 {
  margin: 0;
  font-family: Caveat, cursive;
  font-size: clamp(46px, 8vw, 82px);
  line-height: .9;
  color: #7a3e39;
}

.title p:last-child {
  margin: 12px 0 0;
  font-size: 14px;
}

.map {
  position: relative;
  width: min(1100px, 94vw);
  height: min(72vh, 680px);
  min-height: 520px;
  margin: 10px auto 40px;
  overflow: hidden;
  border: 10px solid #8b6748;
  border-radius: 12px;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.28) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 70%, rgba(93,55,28,.08) 0 1px, transparent 2px),
    #dcbf86;
  box-shadow: 0 18px 40px rgba(74,45,26,.25), inset 0 0 70px rgba(91,54,26,.22);
}

.map::before {
  content: "";
  position: absolute;
  inset: 18px;
  border: 2px dashed rgba(103,70,39,.35);
  border-radius: 6px;
  pointer-events: none;
}

.route {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

.point {
  position: absolute;
  z-index: 5;
  transform: translate(-50%, -50%);
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  color: #4b3428;
  font: inherit;
}

.dot {
  display: block;
  width: 24px;
  height: 24px;
  margin: auto;
  border-radius: 50%;
  background: #a52d2d;
  border: 4px solid #f5e6c5;
  box-shadow: 0 2px 7px rgba(0,0,0,.3);
  transition: transform .2s ease;
}

.point:hover .dot, .point:focus .dot {
  transform: scale(1.25);
}

.label {
  display: block;
  margin-top: 7px;
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(247,230,193,.88);
  box-shadow: 0 2px 5px rgba(75,52,40,.16);
  white-space: nowrap;
  font-family: Caveat, cursive;
  font-size: 20px;
  font-weight: 700;
}

.start .dot {
  animation: pulse 1.6s infinite;
}

.treasure-icon {
  display: block;
  font-size: 38px;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.25));
  animation: float 2.2s ease-in-out infinite;
}

.treasure .label {
  margin-top: 1px;
  color: #7a3e39;
}

.mountain {
  position: absolute;
  z-index: 1;
  color: #7e8b6b;
  font-size: 150px;
  opacity: .7;
  text-shadow: 35px 18px 0 #9aa27c, 70px 3px 0 #68765e;
}

.mountain1 { left: 6%; top: 8%; transform: rotate(-8deg); }
.mountain2 { right: 15%; bottom: 5%; transform: rotate(9deg) scale(.8); }

.tree {
  position: absolute;
  z-index: 2;
  font-size: 50px;
  filter: sepia(.45);
  opacity: .9;
}
.tree1 { left: 12%; top: 18%; }
.tree2 { left: 42%; bottom: 7%; }
.tree3 { right: 7%; top: 55%; }
.tree4 { right: 28%; top: 9%; }

.flower {
  position: absolute;
  z-index: 2;
  font-size: 30px;
  color: #8f4b4b;
}
.flower1 { left: 25%; bottom: 10%; }
.flower2 { right: 14%; bottom: 25%; }

.cloud {
  position: absolute;
  z-index: 1;
  font-size: 80px;
  color: rgba(255,248,225,.55);
}
.cloud1 { left: 45%; top: 4%; }
.cloud2 { right: 4%; top: 22%; }

.map-note {
  position: absolute;
  z-index: 4;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  font-family: Caveat, cursive;
  font-size: 25px;
  opacity: .75;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  place-items: center;
  padding: 20px;
  background: rgba(43,28,19,.68);
  backdrop-filter: blur(4px);
}

.modal.show { display: grid; }

.modal-card {
  position: relative;
  width: min(760px, 94vw);
  max-height: 92vh;
  overflow: auto;
  border-radius: 16px;
  background: #f7ecd2;
  box-shadow: 0 25px 70px rgba(0,0,0,.4);
  animation: appear .25s ease;
}

.modal-card img {
  display: block;
  width: 100%;
  max-height: 430px;
  object-fit: cover;
}

.modal-content {
  padding: 22px 25px 28px;
}

.modal-number {
  margin: 0 0 3px;
  color: #9a5d4e;
  font-family: Caveat, cursive;
  font-size: 22px;
}

.modal-content h2 {
  margin: 0 0 12px;
  color: #7a3e39;
  font-family: Caveat, cursive;
  font-size: 42px;
}

.modal-content #modalText {
  margin: 0;
  line-height: 1.75;
  font-size: 15px;
}

.close {
  position: absolute;
  z-index: 2;
  right: 12px;
  top: 10px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,248,230,.9);
  color: #7a3e39;
  font-size: 30px;
  cursor: pointer;
}

@keyframes pulse {
  50% { transform: scale(1.15); }
}

@keyframes float {
  50% { transform: translateY(-7px) rotate(2deg); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 700px) {
  .map {
    min-height: 600px;
    height: 76vh;
  }
  .label { font-size: 16px; }
  .dot { width: 21px; height: 21px; }
  .mountain { font-size: 100px; }
  .tree { font-size: 36px; }
  .modal-content h2 { font-size: 34px; }
  .modal-content #modalText { font-size: 14px; }
}

.subtitle-special {
  margin: 6px 0 2px;
  font-family: Caveat, cursive;
  font-size: 24px;
  color: #7a3e39;
}

</style>
</head>
<body>
  <header class="title">
    <p class="small-title">UNA PEQUEÑA AVENTURA</p>
    <h1>Búsqueda del corazón</h1>
    <p class="subtitle-special">Espero que te guste, chabalin</p>
    <p>Un camino hecho de recuerdos, hasta encontrar el tesoro. </p>
  </header>

  <main class="map">
    <div class="cloud cloud1">☁</div>
    <div class="cloud cloud2">☁</div>

    <div class="mountain mountain1">▲</div>
    <div class="mountain mountain2">▲</div>
    <div class="tree tree1">🌲</div>
    <div class="tree tree2">🌲</div>
    <div class="tree tree3">🌲</div>
    <div class="tree tree4">🌲</div>
    <div class="flower flower1">✿</div>
    <div class="flower flower2">✿</div>

    <svg class="route" viewBox="0 0 1000 650" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 90 500 C 170 430, 190 300, 300 330
               S 420 470, 510 400
               S 650 260, 720 310
               S 820 440, 910 210"
            fill="none"
            stroke="#6f4d35"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="13 18"/>
    </svg>

    <button class="point start" data-point="0" style="left:9%; top:77%;">
      <span class="dot"></span><span class="label">Start</span>
    </button>

    <button class="point" data-point="1" style="left:30%; top:50%;">
      <span class="dot"></span><span class="label">The First Meet</span>
    </button>

    <button class="point" data-point="2" style="left:51%; top:62%;">
      <span class="dot"></span><span class="label">I love You?</span>
    </button>

    <button class="point" data-point="3" style="left:72%; top:48%;">
      <span class="dot"></span><span class="label">Nerves</span>
    </button>

    <button class="point" data-point="4" style="left:91%; top:32%;">
      <span class="dot"></span><span class="label">Home</span>
    </button>

    <button class="treasure point" data-point="5" style="left:91%; top:12%;">
      <span class="treasure-icon"></span>
      <span class="label">Alexis</span>
    </button>

    <div class="map-note">Sigue el camino... </div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="close" aria-label="Cerrar">×</button>
      <img id="modalImage" src="" alt="">
      <div class="modal-content">
        <p class="modal-number" id="modalNumber"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
      </div>
    </div>
  </div>

    title: "Nerves",
    text: "Cuando pensé en decirte que te amaba, dudaba mucho de si era correcto, no porque no te amara lo suficiente ni porque estuviera confundido, ya no lo estaba, dudaba porque no sabía si tú también me amabas, amar a alguien tan intensamente y en poco tiempo ocurre muy pocas veces y eso me pasó contigo, el haberme enamorado tan fácil solo me recuerda lo fácil que eres de amar y lo increíble que es conocer la dulzura de tu bello corazón. Los nervios me consumían y el miedo a perderte me asustaba más que el mismo rechazo, porque alejarme de ti no sería fácil, aunque tampoco me imagino una vida sin ti desde que te conocí.",

    title: "Alexis",
    text: "Una vida sin ti no es vida, amo reír de tus tonterías, enamorarme de tu dulzura y ver aquellos ojos que iluminan mi corazón. En el momento en que te volviste mi pareja, me prometi que no iba a arruinarlo, a actuar inmaduro o dejarme llevar por estupideces, me prometí cuidar lo nuestro porque es lo más valioso que tengo ahora, solo me importas tú y más nadie, pues tú eres todo lo que quiero en mi vida.",

const modal = document.getElementById("modal");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
const modalNumber = document.getElementById("modalNumber");
const close = document.getElementById("close");

document.querySelectorAll(".point").forEach(point => {
  point.addEventListener("click", () => {
    const data = points[point.dataset.point];
    modalImage.src = data.image;
    modalImage.alt = data.title;
    modalTitle.textContent = data.title;
    modalText.textContent = data.text;
    modalNumber.textContent = data.number;
    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");
  });
});

function closeModal() {
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
}

close.addEventListener("click", closeModal);

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

</script>
